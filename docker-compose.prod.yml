# A whole Atlas & Ink install on one machine: the app and its database.
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Put a reverse proxy that speaks HTTPS (Caddy, nginx, your host's load balancer) in front of
# port 3000. See DEPLOY.md.
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://atlas:${POSTGRES_PASSWORD}@postgres:5432/atlas
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL}
      WEB_ORIGIN: ${PUBLIC_URL}
      TRUST_PROXY: 'true'
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Atlas & Ink <onboarding@resend.dev>}
      PUBLIC_WIKIS: ${PUBLIC_WIKIS:-false}
      ABUSE_EMAIL: ${ABUSE_EMAIL:-}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - storage:/data/storage

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: atlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  storage:
