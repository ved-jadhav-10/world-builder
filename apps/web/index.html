<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Atlas & Ink: one connected home for your world's maps, lore and chapters."
    />
    <meta name="theme-color" content="#f1ede3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Atlas & Ink</title>
    <script>
      // Set the theme before the first paint, so a dark desk never flashes white.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('atlas-theme');
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
